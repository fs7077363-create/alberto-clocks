<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order — Alberto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../css/style.css" rel="stylesheet" />
  <script>try{if(localStorage.getItem('alberto_theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
</head>
<body>
  <nav class="navbar fixed-top py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html"><span class="logo">A</span><span class="brand">ALBERTO</span></a>
      <div class="d-flex align-items-center gap-2">
        <button class="theme-toggle" aria-label="Toggle theme"><span class="knob">🌙</span></button>
        <a href="../index.html#collection" class="btn btn-outline-gold btn-sm rounded-pill px-3">← Collection</a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="container" style="max-width:960px">
      <div class="panel p-0 overflow-hidden fadeup">
        <div class="row g-0">
          <div class="col-md-6"><img id="wImg" class="order-img" alt="Watch" /></div>
          <div class="col-md-6 p-4 p-lg-5">
            <p id="wBadge" class="eyebrow mb-1"></p>
            <h2 id="wName" class="serif"></h2>
            <p id="wMeta" class="meta"></p>

            <form id="orderForm" class="mt-4">
              <div class="d-flex justify-content-between align-items-center rounded-4 px-3 py-2 mb-3" style="background:var(--bg2)">
                <span>Quantity</span>
                <div class="d-flex align-items-center gap-3">
                  <button type="button" id="minus" class="qty-btn">−</button>
                  <span id="qty">1</span>
                  <button type="button" id="plus" class="qty-btn">+</button>
                </div>
              </div>
              <input name="name" class="form-control mb-3" placeholder="Full name" required />
              <input name="phone" class="form-control mb-3" placeholder="Phone number" required />
              <textarea name="address" class="form-control mb-2" rows="2" placeholder="Delivery address" required></textarea>
              <p id="orderErr" class="small text-danger mb-2"></p>
              <div class="d-flex justify-content-between align-items-center">
                <span id="total" class="serif fs-3 gold"></span>
                <button type="submit" id="submitBtn" class="btn btn-grad rounded-pill px-4 py-3">Buy Now</button>
              </div>
            </form>

            <div id="success" class="text-center mt-4" style="display:none">
              <div class="success-icon">✓</div>
              <h3 class="serif mt-3">Order Confirmed!</h3>
              <p class="muted mb-1">Order <span id="orderNo"></span> · Total <span id="orderTotal"></span></p>
              <p class="muted">Cash on Delivery · Delivery in 3–7 days</p>
              <a href="../index.html" class="btn btn-grad rounded-pill px-5 py-2 mt-2">Done</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/order.js"></script>
</body>
</html>
