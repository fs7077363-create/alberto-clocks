<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Alberto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../css/style.css" rel="stylesheet" />
  <script>try{if(localStorage.getItem('alberto_theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
</head>
<body>
  <nav class="navbar fixed-top py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html"><span class="logo">A</span><span class="brand">ALBERTO</span></a>
      <div class="d-flex align-items-center gap-2">
        <button class="theme-toggle" aria-label="Toggle theme"><span class="knob">🌙</span></button>
        <a href="../index.html" class="btn btn-outline-gold btn-sm rounded-pill px-3">← Home</a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="flip-scene">
      <div class="flip-card" id="flipCard">
        <!-- LOGIN -->
        <div class="flip-face panel">
          <span class="logo mb-3">A</span>
          <p class="eyebrow mb-1">Returning Member</p>
          <h2 class="serif">Welcome Back</h2>
          <form class="auth-form mt-4" data-mode="login">
            <input name="email" type="email" class="form-control mb-3" placeholder="Email address" required />
            <input name="password" type="password" class="form-control mb-2" placeholder="Password" required />
            <p class="msg small mb-2"></p>
            <button type="submit" class="btn btn-grad w-100 rounded-pill py-3">Login</button>
          </form>
          <p class="text-center muted mt-4">New here? <a href="javascript:void(0)" class="gold fw-bold to-signup">Sign Up →</a></p>
        </div>
        <!-- SIGNUP -->
        <div class="flip-face flip-back panel">
          <span class="logo mb-3">A</span>
          <p class="eyebrow mb-1">Join the Maison</p>
          <h2 class="serif">Create Account</h2>
          <form class="auth-form mt-4" data-mode="signup">
            <input name="name" class="form-control mb-3" placeholder="Full name" required />
            <input name="email" type="email" class="form-control mb-3" placeholder="Email address" required />
            <input name="password" type="password" minlength="6" class="form-control mb-2" placeholder="Password (min 6)" required />
            <p class="msg small mb-2"></p>
            <button type="submit" class="btn btn-grad w-100 rounded-pill py-3">Sign Up</button>
          </form>
          <p class="text-center muted mt-4">Already a member? <a href="javascript:void(0)" class="gold fw-bold to-login">← Login</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
